<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />
    <link rel="manifest" href="manifest.json" />
    <title>Keke Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        input, textarea, [contenteditable="true"] {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 16px; -webkit-font-smoothing: antialiased; }
        .container { max-width: 960px; width: 100%; margin: 0 auto; background: #ffffff; border-radius: 36px; padding: 24px 20px 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); }
        .header { text-align: center; margin-bottom: 16px; }
        .header .icon { font-size: 28px; display: block; }
        .header h1 { font-size: 24px; font-weight: 800; color: #0b1a33; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .header h1 .highlight { background: linear-gradient(145deg, #f97316, #ea580c); color: white; padding: 0 14px; border-radius: 60px; font-size: 0.85em; line-height: 1.5; }
        .header .subtitle { color: #94a3b8; font-size: 13px; font-weight: 500; }
        .header .badge-admin { display: inline-block; background: #f97316; color: white; padding: 2px 14px; border-radius: 40px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .stats-bar { display: flex; justify-content: space-between; background: #f8fafc; padding: 10px 16px; border-radius: 14px; margin-bottom: 14px; flex-wrap: wrap; gap: 4px; border: 1px solid #f1f4f9; }
        .stats-bar .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #475569; font-weight: 500; }
        .stats-bar .stat strong { color: #0b1a33; font-size: 17px; font-weight: 800; }
        .stats-bar .stat .stat-icon { font-size: 15px; }
        .add-route-btn { width: 100%; padding: 12px; background: linear-gradient(145deg, #f97316, #ea580c); border: none; border-radius: 16px; color: #ffffff; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(249,115,22,0.2); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
        .add-route-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(249,115,22,0.3); }
        .add-route-btn:active { transform: scale(0.98); }
        .admin-list { max-height: 420px; overflow-y: auto; margin-bottom: 12px; }
        .admin-list::-webkit-scrollbar { width: 3px; }
        .admin-list::-webkit-scrollbar-track { background: #f1f4f9; border-radius: 10px; }
        .admin-list::-webkit-scrollbar-thumb { background: #dce1e9; border-radius: 10px; }
        .admin-item { background: #f8fafc; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid #f1f4f9; }
        .admin-item:hover { background: #f1f4f9; }
        .admin-item .admin-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .admin-item .admin-row input { flex: 1; min-width: 60px; padding: 6px 10px; border: 2px solid #e9edf2; border-radius: 10px; font-size: 13px; font-weight: 500; background: white; transition: border 0.2s; font-family: inherit; }
        .admin-item .admin-row input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.06) !important; }
        .admin-item .admin-row input.admin-loc { flex: 1.3; min-width: 80px; }
        .admin-item .admin-row input.admin-fare { max-width: 80px; }
        .admin-item .admin-row input.admin-dist { max-width: 60px; }
        .admin-item .admin-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .admin-item .admin-index { font-size: 10px; color: #94a3b8; font-weight: 600; min-width: 20px; }
        .image-upload-group { display: flex; gap: 3px; flex-wrap: wrap; }
        .image-upload-btn { padding: 3px 6px; background: #ffffff; border: 2px dashed #dce1e9; border-radius: 6px; font-size: 9px; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; font-family: inherit; position: relative; }
        .image-upload-btn:hover { border-color: #f97316; background: #fff7ed; color: #f97316; }
        .image-upload-btn.has-image { border-color: #22c55e; background: #f0fdf4; color: #22c55e; }
        .image-upload-btn .upload-spinner { display: none; font-size: 9px; animation: spin 0.8s linear infinite; }
        .image-upload-btn .upload-spinner.active { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .image-upload-btn input[type="file"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .image-preview-group { display: flex; gap: 3px; flex-wrap: wrap; }
        .image-preview-wrapper { position: relative; display: inline-block; }
        .image-preview { width: 36px; height: 36px; border-radius: 5px; object-fit: cover; border: 2px solid #e9edf2; cursor: pointer; transition: all 0.2s ease; background: #f1f4f9; display: block; }
        .image-preview:hover { transform: scale(1.05); border-color: #f97316; }
        .image-preview-wrapper .remove-image { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 14px; height: 14px; font-size: 8px; cursor: pointer; display: none; align-items: center; justify-content: center; font-weight: 700; }
        .image-preview-wrapper:hover .remove-image { display: flex; }
        .btn-danger { padding: 4px 10px; background: #fef2f2; border: none; border-radius: 8px; color: #dc2626; font-weight: 600; font-size: 11px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .btn-danger:hover { background: #fecaca; }
        .btn-secondary { padding: 8px 18px; background: #f1f4f9; border: none; border-radius: 12px; color: #1e293b; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-primary { padding: 12px 16px; background: linear-gradient(145deg, #f97316, #ea580c); border: none; border-radius: 18px; color: #ffffff; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(249,115,22,0.25); width: 100%; font-family: inherit; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(249,115,22,0.35); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #ffffff; border-radius: 24px; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.2); animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); padding: 24px 20px 20px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #f1f4f9; }
        .modal-header h2 { font-size: 18px; font-weight: 800; color: #0b1a33; display: flex; align-items: center; gap: 8px; }
        .modal-header h2 i { color: #f97316; }
        .modal-close { width: 32px; height: 32px; border-radius: 50%; background: #f1f4f9; border: none; font-size: 16px; color: #1e293b; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; font-family: inherit; }
        .modal-close:hover { background: #e2e8f0; transform: rotate(90deg); }
        .modal-body .field-group { margin-bottom: 12px; }
        .modal-body .field-group label { display: block; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; padding-left: 4px; }
        .modal-body .field-group input { width: 100%; padding: 10px 14px; font-size: 14px; font-weight: 500; color: #0b1a33; background-color: #f8fafc; border: 2px solid #e9edf2; border-radius: 14px; transition: all 0.2s ease; font-family: inherit; }
        .modal-body .field-group input:focus { border-color: #f97316; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(249,115,22,0.06) !important; }
        .modal-body .field-row { display: flex; gap: 10px; }
        .modal-body .field-row .field-group { flex: 1; }
        .modal-body .auto-reverse-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 0 2px; font-size: 12px; font-weight: 500; color: #475569; }
        .modal-body .auto-reverse-toggle input[type="checkbox"] { width: 16px; height: 16px; accent-color: #f97316; cursor: pointer; }
        .modal-body .auto-reverse-toggle .info-text { font-size: 10px; color: #94a3b8; font-weight: 400; }
        .modal-footer { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 2px solid #f1f4f9; }
        .modal-footer .btn-secondary { flex: 0 0 auto; }
        .modal-footer .btn-primary { flex: 1; }
        .empty-state { text-align: center; padding: 32px 0; color: #94a3b8; }
        .empty-state .big-icon { font-size: 40px; display: block; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; font-weight: 500; }
        .empty-state .sub { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
        .footer-status { margin-top: 16px; font-size: 11px; color: #94a3b8; text-align: center; border-top: 1px solid #f1f4f9; padding-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; transition: background 0.25s; }
        .status-dot.error { background: #f43f5e; }
        .status-dot.loading-dot { background: #f97316; animation: pulseDot 1.2s ease-in-out infinite; }
        @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0b1a33; color: white; padding: 12px 24px; border-radius: 16px; font-weight: 600; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; z-index: 2000; max-width: 90%; display: flex; align-items: center; gap: 8px; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #22c55e; }
        .toast.error { background: #ef4444; }
        .toast.info { background: #f97316; }
        .brand-badge { text-align: center; margin-top: 12px; font-size: 10px; color: #cbd5e1; }
        .brand-badge a { color: #f97316; text-decoration: none; font-weight: 600; }
        .analytics-panel { background: #f8fafc; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; border: 1px solid #f1f4f9; display: none; }
        .analytics-panel.show { display: block; }
        .analytics-panel h3 { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
        .analytics-stat { background: white; padding: 8px; border-radius: 8px; text-align: center; }
        .analytics-stat .val { font-size: 18px; font-weight: 800; color: #0b1a33; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .analytics-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .analytics-toggle { background: transparent; border: 1px dashed #dce1e9; border-radius: 8px; padding: 6px 14px; font-size: 11px; color: #64748b; cursor: pointer; font-family: inherit; font-weight: 600; width: 100%; margin-bottom: 10px; }
        .analytics-toggle:hover { border-color: #f97316; color: #f97316; }
        .image-viewer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .image-viewer-overlay.active { display: flex; }
        .image-viewer-overlay img { max-width: 100%; max-height: 90vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .image-viewer-close { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
        .image-viewer-close:hover { background: rgba(255,255,255,0.25); }
        @media (max-width: 600px) {
            .container { padding: 16px 12px 20px; border-radius: 28px; }
            .header h1 { font-size: 20px; }
            .admin-item .admin-row { flex-direction: column; align-items: stretch; }
            .admin-item .admin-row input { min-width: unset; }
            .admin-item .admin-row input.admin-fare, .admin-item .admin-row input.admin-dist { max-width: unset; }
            .stats-bar { flex-direction: column; text-align: center; }
            .modal-body .field-row { flex-direction: column; gap: 0; }
            .modal-footer { flex-direction: column; }
            .modal-footer .btn-secondary { width: 100%; }
            .image-upload-group { width: 100%; }
            .image-upload-btn { flex: 1; justify-content: center; }
        }
        @media (max-width: 400px) {
            .image-upload-group { flex-direction: column; }
            .image-upload-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="icon">⚙️</span>
            <h1>Keke <span class="highlight">Admin</span></h1>
            <div class="subtitle">Manage fares</div>
            <div class="badge-admin">🔐 Admin</div>
        </div>

        <div class="stats-bar">
            <div class="stat"><span class="stat-icon">📋</span> Routes: <strong id="routeCount">0</strong></div>
            <div class="stat"><span class="stat-icon">📍</span> Locations: <strong id="locationCount">0</strong></div>
            <div class="stat"><span class="stat-icon">🔄</span> Auto-Reverse: <strong id="reverseStatus">On</strong></div>
            <div class="stat"><span class="stat-icon">💾</span> <span id="saveStatus">Ready</span></div>
        </div>

        <button class="analytics-toggle" id="analyticsToggle">📊 Show analytics</button>
        <div class="analytics-panel" id="analyticsPanel">
            <h3>📊 Usage Stats</h3>
            <div class="analytics-grid">
                <div class="analytics-stat"><div class="val" id="statRoutes">—</div><div class="lbl">Routes</div></div>
                <div class="analytics-stat"><div class="val" id="statLocations">—</div><div class="lbl">Locations</div></div>
                <div class="analytics-stat"><div class="val" id="statImages">—</div><div class="lbl">Images</div></div>
                <div class="analytics-stat"><div class="val" id="statCache">—</div><div class="lbl">Cache age</div></div>
            </div>
        </div>

        <button class="add-route-btn" id="openModalBtn"><i class="fas fa-plus-circle"></i> Add Route</button>

        <div id="adminList"><div class="empty-state"><span class="big-icon">📭</span><p>No routes yet</p><div class="sub">Click "Add Route" to get started</div></div></div>

        <button class="btn-primary" id="saveChangesBtn">💾 Save All</button>

        <div class="footer-status"><span class="status-dot" id="statusDot"></span><span id="statusText">Ready</span></div>
        <div class="brand-badge">Powered by <a href="#">Liko Tec Solutions</a></div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Add Route</h2>
                <button class="modal-close" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="field-group"><label>📍 From</label><input type="text" id="modalFrom" placeholder="e.g., Ho Central" /></div>
                <div class="field-group"><label>🏁 To</label><input type="text" id="modalTo" placeholder="e.g., Ho Poly" /></div>
                <div class="field-row">
                    <div class="field-group"><label>💰 Fare (GHS)</label><input type="number" id="modalFare" placeholder="2.50" step="0.01" /></div>
                    <div class="field-group"><label>📏 Distance</label><input type="text" id="modalDist" placeholder="1.2" /></div>
                </div>
                <div class="auto-reverse-toggle">
                    <input type="checkbox" id="modalAutoReverse" checked />
                    <label for="modalAutoReverse">🔄 Auto-reverse</label>
                    <span class="info-text">(same fare)</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelModalBtn">Cancel</button>
                <button class="btn-primary" id="saveRouteBtn"><i class="fas fa-save"></i> Add</button>
            </div>
        </div>
    </div>

    <div class="image-viewer-overlay" id="imageViewer">
        <button class="image-viewer-close" id="imageViewerClose">✕</button>
        <img id="imageViewerImg" src="" alt="Preview" />
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyDgzPzWOlboZyGxVldLack1ryLFODzTqiUJ3JoNRPqpg-S0ZsxAT9vN8X-800eHFPPFQ/exec';

        const $ = id => document.getElementById(id);
        const adminList = $('adminList');
        const routeCount = $('routeCount');
        const locationCount = $('locationCount');
        const reverseStatus = $('reverseStatus');
        const saveStatus = $('saveStatus');
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const openModalBtn = $('openModalBtn');
        const saveChangesBtn = $('saveChangesBtn');
        const autoReverseToggle = $('modalAutoReverse');
        const toast = $('toast');
        const analyticsToggle = $('analyticsToggle');
        const analyticsPanel = $('analyticsPanel');
        const imageViewer = $('imageViewer');
        const imageViewerImg = $('imageViewerImg');
        const imageViewerClose = $('imageViewerClose');

        const modalOverlay = $('addModal');
        const closeModalBtn = $('closeModalBtn');
        const cancelModalBtn = $('cancelModalBtn');
        const saveRouteBtn = $('saveRouteBtn');
        const modalFrom = $('modalFrom');
        const modalTo = $('modalTo');
        const modalFare = $('modalFare');
        const modalDist = $('modalDist');
        const modalAutoReverse = $('modalAutoReverse');

        let editedData = [];
        let toastTimeout = null;
        let isSaving = false;
        let isLoading = false;

        function safeStr(val) {
            if (val === null || val === undefined) return '';
            return String(val).trim();
        }

        function showToast(msg, type) {
            type = type || 'info';
            if (toastTimeout) clearTimeout(toastTimeout);
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            toastTimeout = setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }

        function setStatus(text, type) {
            type = type || 'idle';
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (type === 'error') statusDot.classList.add('error');
            else if (type === 'loading') statusDot.classList.add('loading-dot');
            saveStatus.textContent = text;
        }

        function openImageViewer(url) {
            if (!url) return;
            imageViewerImg.src = url;
            imageViewer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            imageViewer.classList.remove('active');
            imageViewerImg.src = '';
            document.body.style.overflow = '';
        }

        imageViewerClose.addEventListener('click', function(e) {
            e.preventDefault(); e.stopPropagation(); closeImageViewer();
        });
        imageViewer.addEventListener('click', function(e) {
            if (e.target === imageViewer) closeImageViewer();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && imageViewer.classList.contains('active')) closeImageViewer();
        });

        function openModal() {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(function() { modalFrom.focus(); }, 100);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            modalFrom.value = ''; modalTo.value = '';
            modalFare.value = ''; modalDist.value = '';
            modalAutoReverse.checked = true;
        }

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });

        function extractUniqueLocations(data) {
            const set = new Set();
            data.forEach(function(row) {
                const f = safeStr(row.from_location);
                const t = safeStr(row.to_location);
                if (f) set.add(f);
                if (t) set.add(t);
            });
            return Array.from(set).sort();
        }

        function buildImageInfo(fileId) {
            const clean = safeStr(fileId);
            if (!clean) return null;
            let id = clean;
            if (clean.indexOf('http') === 0) {
                const dMatch = clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
                const idMatch = clean.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                id = (dMatch && dMatch[1]) || (idMatch && idMatch[1]) || clean;
            }
            return {
                id: id,
                primary: 'https://lh3.googleusercontent.com/d/' + id + '=w1000',
                fallback: 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1000'
            };
        }

        function hasImage(row, slot) { return safeStr(row['image_' + slot]) !== ''; }

        function getImageCount(row) {
            let c = 0;
            for (let i = 1; i <= 3; i++) if (hasImage(row, i)) c++;
            return c;
        }

        function esc(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function loadData() {
            if (isLoading) return;
            isLoading = true;
            setStatus('Loading…', 'loading');

            try {
                const res = await fetch(API_URL + '?t=' + Date.now(), {
                    cache: 'no-store', headers: { 'Accept': 'application/json' }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const raw = await res.json();
                if (raw.error) throw new Error(raw.message || 'Server error');

                editedData = Array.isArray(raw) ? raw.map(function(r) { return Object.assign({}, r); }) : [];

                try {
                    localStorage.setItem('keke_fares_cache', JSON.stringify(editedData));
                    localStorage.setItem('keke_fares_cache_time', Date.now());
                } catch (e) {}

                renderList();
                setStatus('✅ ' + editedData.length + ' routes loaded');
            } catch (err) {
                console.error('Load error:', err);
                try {
                    const cached = localStorage.getItem('keke_fares_cache');
                    if (cached) {
                        editedData = JSON.parse(cached);
                        renderList();
                        const t = parseInt(localStorage.getItem('keke_fares_cache_time') || '0');
                        const mins = Math.round((Date.now() - t) / 60000);
                        setStatus('📴 Offline cache (' + mins + 'm old)', 'error');
                        showToast('Showing cached data', 'info');
                        isLoading = false;
                        return;
                    }
                } catch (e) {}
                setStatus('⚠️ ' + err.message, 'error');
                showToast('Failed to load: ' + err.message, 'error');
            } finally {
                isLoading = false;
            }
        }

        function renderList() {
            const locs = extractUniqueLocations(editedData);
            locationCount.textContent = locs.length;
            routeCount.textContent = editedData.length;
            reverseStatus.textContent = autoReverseToggle && autoReverseToggle.checked ? 'On' : 'Off';
            reverseStatus.style.color = (autoReverseToggle && autoReverseToggle.checked) ? '#22c55e' : '#94a3b8';

            if (editedData.length === 0) {
                adminList.innerHTML = '<div class="empty-state"><span class="big-icon">📭</span><p>No routes yet</p><div class="sub">Click "Add Route" to get started</div></div>';
                return;
            }

            let html = '';
            editedData.forEach(function(row, idx) {
                let preview = '';
                for (let i = 1; i <= 3; i++) {
                    const key = 'image_' + i;
                    if (safeStr(row[key])) {
                        const info = buildImageInfo(row[key]);
                        if (info) {
                            preview += '<div class="image-preview-wrapper">' +
                                '<img src="' + esc(info.primary) + '" class="image-preview" ' +
                                'data-primary="' + esc(info.primary) + '" ' +
                                'data-fallback="' + esc(info.fallback) + '" ' +
                                'data-tried-fallback="0" ' +
                                'onerror="handleImageError(this)" />' +
                                '<button class="remove-image" data-action="remove-image" data-idx="' + idx + '" data-slot="' + i + '">✕</button>' +
                                '</div>';
                        }
                    }
                }

                html += '<div class="admin-item" data-index="' + idx + '">' +
                    '<div class="admin-row">' +
                        '<span class="admin-index">#' + (idx+1) + '</span>' +
                        '<input class="admin-loc" type="text" value="' + esc(row.from_location||'') + '" placeholder="From" data-field="from_location" />' +
                        '<span style="color:#f97316;font-weight:700;">→</span>' +
                        '<input class="admin-loc" type="text" value="' + esc(row.to_location||'') + '" placeholder="To" data-field="to_location" />' +
                        '<input class="admin-fare" type="number" value="' + esc(row.fare_ghs||'') + '" placeholder="GHS" step="0.01" data-field="fare_ghs" />' +
                        '<input class="admin-dist" type="text" value="' + esc(row.distance_km||'') + '" placeholder="km" data-field="distance_km" />' +
                        '<div class="admin-actions">' +
                            '<div class="image-upload-group">' +
                                [1,2,3].map(function(s) {
                                    return '<label class="image-upload-btn ' + (hasImage(row,s)?'has-image':'') + '">📷' + s +
                                        '<input type="file" accept="image/*" data-idx="' + idx + '" data-slot="' + s + '" />' +
                                        '<span class="upload-spinner" id="spinner_' + idx + '_' + s + '">⏳</span>' +
                                        '</label>';
                                }).join('') +
                            '</div>' +
                            (preview ? '<div class="image-preview-group">' + preview + '</div>' : '') +
                            '<button class="btn-danger" data-action="remove-route" data-idx="' + idx + '">✕</button>' +
                        '</div>' +
                    '</div>' +
                    (getImageCount(row) > 0 ? '<div style="font-size:9px;color:#94a3b8;margin-top:2px;">📸 ' + getImageCount(row) + ' images</div>' : '') +
                '</div>';
            });

            adminList.innerHTML = html;
            attachListEvents();
        }

        window.handleImageError = function(img) {
            const triedFallback = img.dataset.triedFallback === '1';
            if (!triedFallback && img.dataset.fallback) {
                img.dataset.triedFallback = '1';
                img.src = img.dataset.fallback;
            } else {
                img.onerror = null;
                img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">' +
                    '<rect width="36" height="36" fill="#f1f4f9" rx="5"/>' +
                    '<text x="18" y="22" font-size="14" text-anchor="middle" fill="#94a3b8">🖼️</text>' +
                    '</svg>'
                );
            }
        };

        function attachListEvents() {
            document.querySelectorAll('.admin-item').forEach(function(item) {
                const idx = parseInt(item.dataset.index);

                item.querySelectorAll('input:not([type="file"])').forEach(function(inp) {
                    inp.addEventListener('input', function() {
                        const field = this.dataset.field;
                        if (field) {
                            editedData[idx][field] = this.value;
                            const locs = extractUniqueLocations(editedData);
                            locationCount.textContent = locs.length;
                        }
                    });
                });

                item.querySelectorAll('input[type="file"]').forEach(function(inp) {
                    inp.addEventListener('change', function() {
                        uploadImage(this, parseInt(this.dataset.idx), parseInt(this.dataset.slot));
                    });
                });

                item.querySelectorAll('.image-preview').forEach(function(img) {
                    img.addEventListener('click', function(e) {
                        e.preventDefault(); e.stopPropagation();
                        openImageViewer(this.dataset.primary);
                    });
                });

                item.querySelectorAll('[data-action="remove-image"]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault(); e.stopPropagation();
                        removeImage(parseInt(this.dataset.idx), parseInt(this.dataset.slot));
                    });
                });

                item.querySelectorAll('[data-action="remove-route"]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault(); e.stopPropagation();
                        removeRoute(parseInt(this.dataset.idx));
                    });
                });
            });
        }

        async function uploadImage(input, idx, slot) {
            const file = input.files[0];
            if (!file) return;
            if (file.type.indexOf('image/') !== 0) { showToast('Please select an image', 'error'); input.value = ''; return; }
            if (file.size > 5 * 1024 * 1024) { showToast('Image must be under 5MB', 'error'); input.value = ''; return; }

            const spinner = document.getElementById('spinner_' + idx + '_' + slot);
            if (spinner) spinner.classList.add('active');

            try {
                const dataUrl = await new Promise(function(resolve, reject) {
                    const reader = new FileReader();
                    reader.onload = function() { resolve(reader.result); };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                const base64 = dataUrl.split(',')[1];

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        type: 'image', file: base64, fileName: file.name,
                        mimeType: file.type, routeIndex: idx, imageSlot: slot
                    })
                });

                const result = await res.json();
                if (result.error) throw new Error(result.message || 'Upload failed');

                if (result.success && result.fileId) {
                    editedData[idx]['image_' + slot] = result.fileId;

                    if (result.shared === false) {
                        showToast('⚠️ Uploaded but sharing failed — run fixAllImageSharing()', 'error');
                    } else {
                        showToast('✅ Image ' + slot + ' uploaded', 'success');
                    }

                    setTimeout(function() { renderList(); }, 1500);
                } else {
                    throw new Error('Upload response invalid');
                }
            } catch (err) {
                console.error('Upload error:', err);
                showToast('Upload failed: ' + err.message, 'error');
            } finally {
                if (spinner) spinner.classList.remove('active');
                input.value = '';
            }
        }

        function removeImage(idx, slot) {
            if (confirm('Remove image ' + slot + '?')) {
                editedData[idx]['image_' + slot] = '';
                renderList();
                showToast('Image removed', 'info');
            }
        }

        function removeRoute(idx) {
            if (confirm('Remove route #' + (idx+1) + '?')) {
                editedData.splice(idx, 1);
                renderList();
                showToast('Route removed', 'info');
                setStatus('🗑️ Removed - save to apply');
            }
        }

        function addRouteFromModal() {
            const from = safeStr(modalFrom.value);
            const to = safeStr(modalTo.value);
            const fare = parseFloat(modalFare.value);
            const dist = safeStr(modalDist.value);

            if (!from || !to || isNaN(fare) || fare < 0) {
                showToast('⚠️ Fill all fields correctly', 'error');
                return;
            }

            const exists = editedData.some(function(r) {
                return safeStr(r.from_location).toLowerCase() === from.toLowerCase() &&
                       safeStr(r.to_location).toLowerCase() === to.toLowerCase();
            });
            if (exists) { showToast('⚠️ Route already exists', 'error'); return; }

            editedData.push({
                from_location: from, to_location: to, fare_ghs: fare,
                distance_km: dist || '', notes: '',
                image_1: '', image_2: '', image_3: ''
            });

            if (modalAutoReverse.checked) {
                const revExists = editedData.some(function(r) {
                    return safeStr(r.from_location).toLowerCase() === to.toLowerCase() &&
                           safeStr(r.to_location).toLowerCase() === from.toLowerCase();
                });
                if (!revExists) {
                    editedData.push({
                        from_location: to, to_location: from, fare_ghs: fare,
                        distance_km: dist || '', notes: 'Auto-reverse',
                        image_1: '', image_2: '', image_3: ''
                    });
                }
            }

            renderList();
            setStatus('➕ Added - save to apply');
            showToast('✅ Route added!', 'success');

            modalFrom.value = ''; modalTo.value = '';
            modalFare.value = ''; modalDist.value = '';
            modalFrom.focus();
        }

        saveRouteBtn.addEventListener('click', addRouteFromModal);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && modalOverlay.classList.contains('active')) {
                const t = e.target;
                if (['modalFrom', 'modalTo', 'modalFare', 'modalDist'].indexOf(t.id) !== -1) {
                    e.preventDefault();
                    addRouteFromModal();
                }
            }
        });

        async function saveChanges() {
            if (isSaving) return;
            isSaving = true;
            setStatus('💾 Saving…', 'loading');
            saveChangesBtn.disabled = true;
            showToast('Saving…', 'info');

            try {
                const saveData = editedData.map(function(r) {
                    return {
                        from_location: safeStr(r.from_location),
                        to_location: safeStr(r.to_location),
                        fare_ghs: parseFloat(r.fare_ghs) || 0,
                        distance_km: safeStr(r.distance_km),
                        notes: safeStr(r.notes),
                        image_1: safeStr(r.image_1),
                        image_2: safeStr(r.image_2),
                        image_3: safeStr(r.image_3)
                    };
                });

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(saveData)
                });

                const result = await res.json();
                if (result.error) throw new Error(result.message || 'Save failed');

                showToast('✅ ' + saveData.length + ' routes saved!', 'success');
                setStatus('✅ ' + saveData.length + ' saved');
                await loadData();
            } catch (err) {
                console.error('❌ Save error:', err);
                setStatus('⚠️ ' + err.message, 'error');
                showToast('Error: ' + err.message, 'error');
            } finally {
                isSaving = false;
                saveChangesBtn.disabled = false;
            }
        }

        saveChangesBtn.addEventListener('click', saveChanges);

        analyticsToggle.addEventListener('click', function() {
            const isOpen = analyticsPanel.classList.toggle('show');
            analyticsToggle.textContent = isOpen ? '📊 Hide analytics' : '📊 Show analytics';

            if (isOpen) {
                document.getElementById('statRoutes').textContent = editedData.length;
                document.getElementById('statLocations').textContent = extractUniqueLocations(editedData).length;
                let imgCount = 0;
                editedData.forEach(function(r) { imgCount += getImageCount(r); });
                document.getElementById('statImages').textContent = imgCount;

                const cacheTime = parseInt(localStorage.getItem('keke_fares_cache_time') || '0');
                if (cacheTime) {
                    const mins = Math.round((Date.now() - cacheTime) / 60000);
                    document.getElementById('statCache').textContent = mins < 1 ? 'Now' : mins + 'm';
                } else {
                    document.getElementById('statCache').textContent = '—';
                }
            }
        });

        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'IMG') {
                e.preventDefault();
            }
        });

        loadData();
    </script>

</body>
